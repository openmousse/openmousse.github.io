/* Layout: one live page. Every section is a short head plus one working demo of OpenMousse (composer, A2A thread, Babel refine, memory tree, store, tiers); content width 1160.
   Two bases share the layout. A = Leo's 10/31 template (warm ink, orange, glow + grid, light theme too). B = the design tree (cold ink, one gold per screen, cyan = now, amber = waiting, particles that morph with scroll). Since Leo picked B on 10/31 the preview is B only, dark or light; light uses the site's light tokens (site-v3 spec 1.7). */
:root{
  --bg:#0a0a0b;--bg-2:#101012;--surface:#141416;--surface-2:#1c1c1f;
  --ink:#f4f3f0;--ink-2:#a9a8a3;--ink-3:#74736f;--line:#242427;--line-2:#38383c;
  --accent:#ff7a4d;--accent-text:#ff7a4d;--accent-ink:#1c0a03;
  --hi:#ff7a4d;--hi-ink:#1c0a03;--now:#5fe0a8;--now-ink:#04231a;--wait:#ff7a4d;
  --glow:rgba(255,122,77,.20);--glass:rgba(20,20,22,.8);--head:rgba(10,10,11,.72);--shade:rgba(0,0,0,.8);
  --display:"Manrope","Avenir Next","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"Instrument Sans","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --w-h1:800;--w-h2:700;--w-h3:700;--tr-h1:-.055em;--tr-h2:-.04em;
  --r-card:28px;--r-win:22px;
  --maxw:1160px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]):not([data-base="b"]){
    --bg:#f7f6f3;--bg-2:#efeeea;--surface:#ffffff;--surface-2:#f3f2ee;--ink:#121211;--ink-2:#4a4945;--ink-3:#6c6b66;
    --line:#e3e1db;--line-2:#cfcdc6;--accent:#e2552a;--accent-text:#c94518;--accent-ink:#ffffff;--hi:#e2552a;--hi-ink:#ffffff;
    --now:#0f9d6a;--now-ink:#ffffff;--wait:#e2552a;--glow:rgba(226,85,42,.18);--glass:rgba(255,255,255,.85);--head:rgba(247,246,243,.78);--shade:rgba(40,30,20,.25);
    color-scheme:light;
  }
}
:root[data-theme="light"]:not([data-base="b"]){
  --bg:#f7f6f3;--bg-2:#efeeea;--surface:#ffffff;--surface-2:#f3f2ee;--ink:#121211;--ink-2:#4a4945;--ink-3:#6c6b66;
  --line:#e3e1db;--line-2:#cfcdc6;--accent:#e2552a;--accent-text:#c94518;--accent-ink:#ffffff;--hi:#e2552a;--hi-ink:#ffffff;
  --now:#0f9d6a;--now-ink:#ffffff;--wait:#e2552a;--glow:rgba(226,85,42,.18);--glass:rgba(255,255,255,.85);--head:rgba(247,246,243,.78);--shade:rgba(40,30,20,.25);
  color-scheme:light;
}
:root[data-base="b"]{
  --bg:#0B0D10;--bg-2:#0F1216;--surface:#12161B;--surface-2:#191E24;
  --ink:#ECEEF0;--ink-2:#AAB2BB;--ink-3:#858E98;--line:#1C2229;--line-2:#2A323B;
  /* gold is kept for the one main action per screen; heading accents step down one level of brightness instead */
  --accent:#D9AE62;--accent-text:#9AA3AD;--accent-ink:#1A1206;
  --hi:#5CCFE6;--hi-ink:#04212A;--now:#5CCFE6;--now-ink:#04212A;--wait:#E5AD4E;
  --glow:rgba(217,174,98,.10);--glass:rgba(18,22,27,.74);--head:rgba(11,13,16,.7);--shade:rgba(0,0,0,.85);
  --accent-hover:#E6C07A;--wait-text:#E5AD4E;--wait-edge:transparent;--dot:#5CCFE6;--dot-edge:transparent;--mark:#D9AE62;
  /* particles: rgb of the ink, gold and cyan dust, and the ink dust's alpha */
  --pf-0:236,238,240;--pf-1:217,174,98;--pf-2:92,207,230;--pf-k0:.62;
  --display:"Host Grotesk","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
  --body:"Host Grotesk","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK SC",monospace;
  --w-h1:500;--w-h2:500;--w-h3:500;--tr-h1:-.045em;--tr-h2:-.035em;
  --r-card:20px;--r-win:18px;
  color-scheme:dark;
}
/* B light = the site's light tokens (site-v3 spec 1.7): gold fill and the ring stay #D9AE62, gold / cyan / amber text step darker,
   and dots get a 1.5px edge so they keep 3:1 against the page. Marks the canvases draw (memory arcs, the end mark) use the darker chart gold. */
:root[data-base="b"][data-theme="light"]{
  --bg:#F1F3F4;--bg-2:#E9ECEE;--surface:#FFFFFF;--surface-2:#E7EAEC;
  --ink:#12151A;--ink-2:#4B535C;--ink-3:#626A74;--line:#DCE0E3;--line-2:#C8CED4;
  --accent:#D9AE62;--accent-hover:#CB9C4E;--accent-text:#6E7680;--accent-ink:#2A1E06;
  --hi:#0E738A;--hi-ink:#FFFFFF;--now:#0E738A;--now-ink:#FFFFFF;--wait:#E0A03A;--wait-text:#8A5A06;--wait-edge:#8A5A06;
  --dot:#5CCFE6;--dot-edge:#0E738A;--mark:#B07D22;
  --pf-0:18,21,26;--pf-1:176,125,34;--pf-2:14,115,138;--pf-k0:.42;
  --glow:rgba(217,174,98,.14);--glass:rgba(255,255,255,.8);--head:rgba(241,243,244,.84);--shade:rgba(16,18,22,.2);
  color-scheme:light;
}
:root[data-theme="light"] .pdot,:root[data-theme="light"] .sd:not(.wt),:root[data-theme="light"][data-base="b"] .nd::after,:root[data-theme="light"] .node.away .nd::after,:root[data-theme="light"] .ph-h small::before{background:var(--dot);border:1.5px solid var(--dot-edge)}
:root[data-theme="light"] .sd.wt,:root[data-theme="light"] .wcard i,:root[data-theme="light"] .av.q::after{border:1.5px solid var(--wait-edge)}
:root[data-theme="light"] .cring .wdot{stroke:var(--wait-edge);stroke-width:1.5}
.lg-b .dt{fill:var(--dot,#5CCFE6);stroke:var(--dot-edge,transparent);stroke-width:1}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
p{margin:0}
button,textarea,input{font-family:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:3px;border-radius:8px}
main,footer{position:relative;z-index:1}
.w{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kick{font:500 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h2{font-size:clamp(2rem,4.4vw,3.4rem);line-height:1.05;letter-spacing:var(--tr-h2);font-weight:var(--w-h2)}
h2 em,h1 em{font-style:normal;color:var(--accent-text)}
.sub{font-size:1.15rem;line-height:1.5;color:var(--ink-2);max-width:32em}
.fn{font:500 .88em/1 var(--mono);background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap}
:lang(zh) h1{letter-spacing:-.01em;line-height:1.14}
:lang(zh) h2{letter-spacing:0;line-height:1.2}
:lang(zh) h3{letter-spacing:0}
:lang(zh) .kick{letter-spacing:.04em}
:lang(zh) body,:lang(zh) .sub{line-height:1.7}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;font:600 15px/1 var(--display);text-decoration:none;cursor:pointer;transition:background-color .2s,color .2s,border-color .2s,transform .15s;will-change:transform;white-space:nowrap}
.btn-pri{background:var(--ink);color:var(--bg)}
.btn-pri:hover{background:var(--accent);color:var(--accent-ink)}
:root[data-base="b"] .btn{font-weight:500}
:root[data-base="b"] .btn-pri{background:var(--accent);color:var(--accent-ink)}
:root[data-base="b"] .btn-pri:hover{background:var(--accent-hover,#E6C07A)}
:root[data-base="b"] header .btn-pri{background:transparent;color:var(--ink);border-color:var(--line-2)}
:root[data-base="b"] header .btn-pri:hover{border-color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{min-height:40px;padding:0 18px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--head);-webkit-backdrop-filter:saturate(150%) blur(16px);backdrop-filter:saturate(150%) blur(16px);border-bottom:1px solid var(--line)}
.top .w{display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 20px/1 var(--display);letter-spacing:-.03em}
:root[data-base="b"] .brand{font-weight:500;letter-spacing:-.02em}
.brand svg{width:24px;height:24px;flex:none}
.lg-b{display:none}
:root[data-base="b"] .lg-a{display:none}
:root[data-base="b"] .lg-b{display:block}
.nav{display:flex;gap:26px;margin-left:auto}
.nav a{font-size:15px;color:var(--ink-2);text-decoration:none;transition:color .2s;white-space:nowrap}
.nav a:hover{color:var(--ink)}
/* the language button names the other language, as on the docs pages (Leo 10/19) */
.lbtn{all:unset;cursor:pointer;font-size:14px;color:var(--ink-2);padding:8px 2px;white-space:nowrap;transition:color .2s}
.lbtn:hover{color:var(--ink)}
.lbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.top .lbtn+.btn{margin-left:-8px}
@media (max-width:960px){.nav{display:none}.top .btn{margin-left:auto}.top .lbtn{margin-left:auto}.top .lbtn+.btn{margin-left:-8px}}
@media (max-width:520px){.top .w{gap:14px}.lbtn{font-size:13px}}

/* hero */
.hero{position:relative;padding-block:84px 40px;text-align:center;overflow:hidden}
.spot{position:absolute;left:0;top:0;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 62%);pointer-events:none;will-change:transform;z-index:0}
.grid{position:absolute;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.45;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000,transparent 75%)}
:root[data-base="b"] .grid,:root[data-base="b"] .spot,:root[data-base="b"] .spot2{display:none}
.hero .w{position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:999px;padding:7px 16px 7px 12px;font:500 13px/1.2 var(--body);color:var(--ink-2);background:var(--surface);max-width:100%}
.pill em{font-style:normal;color:var(--ink)}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--now);flex:none;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--now) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.hero h1{font-size:clamp(2.9rem,8vw,6.2rem);line-height:.98;letter-spacing:var(--tr-h1);font-weight:var(--w-h1);margin:28px auto 22px;max-width:11em}
:lang(zh) .hero h1{font-size:clamp(2.4rem,6.6vw,5.2rem);max-width:12em;line-height:1.08}
/* Chinese headings break only after punctuation, so 工作台 never splits across lines */
:lang(zh) h1,:lang(zh) h2,:lang(zh) h3{word-break:keep-all;overflow-wrap:anywhere}
.rot{font:500 clamp(1.1rem,2.2vw,1.45rem)/1.3 var(--display);letter-spacing:-.02em;color:var(--ink-2);min-height:1.5em}
.rot #rot{color:var(--ink);display:inline-block;transition:opacity .35s,transform .35s}
.rot #rot.out{opacity:0;transform:translateY(8px)}
.rot::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--hi);margin-left:5px;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:32px}

/* stage + window */
.stage{position:relative;margin-top:64px;perspective:1400px}
.win{position:relative;z-index:2;max-width:860px;margin:0 auto;text-align:left;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--line-2);border-radius:var(--r-win);box-shadow:0 60px 120px -60px var(--shade),0 0 0 1px color-mix(in srgb,var(--ink) 4%,transparent) inset;transform-style:preserve-3d;will-change:transform}
.wtop{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-3)}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.wtop b{font-weight:500;color:var(--ink-2);margin:0 auto}
.live{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--now);white-space:nowrap}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.conv{padding:22px 22px 10px;min-height:250px;display:flex;flex-direction:column;gap:16px}
.um{align-self:flex-end;max-width:84%;background:var(--surface-2);border:1px solid var(--line);padding:12px 16px;border-radius:18px 18px 4px 18px;font-size:16px;display:flex;flex-direction:column;gap:8px}
.am{display:flex;flex-direction:column;gap:8px;max-width:92%}
.ah{display:flex;align-items:center;gap:8px;font:500 12px/1.3 var(--mono);color:var(--ink-3);letter-spacing:.03em}
.ah i{width:8px;height:8px;border-radius:50%;background:var(--hi)}
.ah b{color:var(--ink);font-weight:500}
.at{color:var(--ink-2);font-size:16px;line-height:1.6}
.at em{font-style:normal;color:var(--wait-text,var(--wait))}
.at.run::after{content:"";display:inline-block;width:7px;height:1em;background:var(--hi);margin-left:3px;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
:root[data-base="b"] .at.run::after{width:8px;height:8px;border-radius:50%;vertical-align:.05em}
.fchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--bg-2);border-radius:10px;padding:6px 10px;font:12px/1.2 var(--mono);color:var(--ink-2);max-width:100%}
.fchip svg{width:14px;height:14px;flex:none;color:var(--hi)}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fchip button{appearance:none;border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:0 0 0 2px}
.fchip button:hover{color:var(--ink)}

/* composer */
.cmp{margin:10px 14px 14px;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:12px 12px 10px;transition:border-color .2s,box-shadow .2s}
.cmp:focus-within,.win.drop .cmp{border-color:var(--hi);box-shadow:0 0 0 4px color-mix(in srgb,var(--hi) 16%,transparent)}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;padding:0 4px}
.files:empty{display:none}
.cmp textarea{display:block;width:100%;resize:none;border:0;background:transparent;color:var(--ink);font:400 16px/1.5 var(--body);padding:4px 6px;min-height:28px;max-height:120px}
.cmp textarea::placeholder{color:var(--ink-3)}
.cmp textarea:focus{outline:none}
.crow{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.ib{appearance:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;transition:background-color .2s,color .2s}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib svg{width:19px;height:19px}
.ib[aria-pressed="true"]{color:var(--hi);background:color-mix(in srgb,var(--hi) 14%,transparent)}
.mdl{position:relative}
.mb{appearance:none;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--ink);font:500 14px/1 var(--body);cursor:pointer;transition:border-color .2s}
.mb:hover,.mb[aria-expanded="true"]{border-color:var(--ink-3)}
.mb svg{width:12px;height:12px;color:var(--ink-3)}
.menu{position:absolute;left:0;bottom:calc(100% + 8px);z-index:10;min-width:250px;max-height:min(440px,70vh);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:6px;box-shadow:0 30px 60px -20px var(--shade)}
.menu .mh{margin:0;padding:8px 12px 4px;font:500 10.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.menu button{appearance:none;display:flex;width:100%;align-items:center;gap:10px;padding:8px 12px;border:0;background:transparent;color:var(--ink);border-radius:9px;font:500 14px/1.2 var(--body);cursor:pointer;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2)}
.menu button[aria-checked="true"]::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hi);flex:none}
.menu button[aria-checked="false"]::before{content:"";width:7px;height:7px;flex:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.modes{display:flex;gap:2px;margin-left:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:2px}
.modes button{appearance:none;border:0;background:transparent;color:var(--ink-3);height:30px;padding:0 11px;border-radius:8px;font:500 13px/1 var(--body);cursor:pointer;transition:all .2s}
.modes button:hover{color:var(--ink)}
.modes button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.sp{flex:1}
.send{appearance:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;transition:background-color .2s,transform .15s}
.send:hover{background:var(--accent);color:var(--accent-ink)}
.send svg{width:17px;height:17px}
.hint{display:block;text-align:center;margin-top:10px;padding-bottom:12px;font:12px var(--mono);color:var(--ink-3)}
@media (max-width:640px){.modes{display:none}.conv{min-height:220px;padding:16px 14px 6px}.um,.am{max-width:100%}}

/* floating cards */
.fl{position:absolute;z-index:3;display:flex;align-items:center;gap:12px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line-2);border-radius:16px;padding:12px 16px;font-size:14px;line-height:1.25;box-shadow:0 30px 50px -30px var(--shade);will-change:transform;text-align:left;max-width:250px}
.fl small{display:block;font:400 11px var(--mono);color:var(--ink-3);margin-top:3px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent);color:var(--accent-ink)}
.av svg{width:16px;height:16px}
.av.v{background:var(--now);color:var(--now-ink)}
.av.q{background:transparent;border:2px solid var(--wait);position:relative}
.av.q::after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--wait);animation:knock 2.4s ease-in-out infinite}
@keyframes knock{0%,70%,100%{transform:none}76%{transform:scale(1.35)}82%{transform:none}88%{transform:scale(1.35)}}
:root[data-base="b"] .av:not(.q):not(.v){background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2)}
.rr{width:34px;height:34px;flex:none;position:relative}
.rr i{position:absolute;inset:6px;border-radius:50%;border:2px solid var(--hi)}
.rr i+i{inset:6px;animation:ripple 2.6s cubic-bezier(.2,.8,.2,1) infinite;opacity:0}
.rr i+i+i{animation-delay:1.3s}
@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.f1{left:-2%;top:12%}.f2{right:-3%;top:30%}.f3{left:2%;bottom:-30px}.f4{right:1%;bottom:-44px}
.fl.bob{animation:bob 6s ease-in-out infinite}
.f2.bob{animation-duration:7.5s;animation-delay:-2s}.f3.bob{animation-duration:6.8s;animation-delay:-3.5s}.f4.bob{animation-duration:8s;animation-delay:-1s}
@keyframes bob{50%{margin-top:-10px}}
@media (max-width:1180px){.fl{display:none}}

/* marquee */
.strip{margin-top:72px;border-block:1px solid var(--line);padding-block:22px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq{display:flex;gap:56px;width:max-content;animation:mq 40s linear infinite}
.mq span{font:700 22px/1.2 var(--display);letter-spacing:-.03em;color:var(--ink-3);white-space:nowrap;display:flex;align-items:center;gap:56px}
:root[data-base="b"] .mq span{font-weight:500}
.mq span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--line-2)}
@keyframes mq{to{transform:translateX(calc(-50% - 28px))}}
.mline{text-align:center;margin-top:18px;font-size:15px;color:var(--ink-3)}
.mline em{font-style:normal;color:var(--ink)}

/* sections */
.sec{padding-block:120px}
.head{display:flex;flex-direction:column;gap:18px;margin-bottom:56px;max-width:40em}
.head.c{margin-inline:auto;text-align:center;align-items:center}
:lang(zh) .head.c{max-width:44em}
@media (max-width:860px){.sec{padding-block:76px}.head{margin-bottom:36px}}

/* scenes (10/31 step 2): short loops carry what the paragraphs said. The scene root gets data-st (the beat now) and s1…sN (beats reached);
   a [data-on] child shows on the beats it lists; .stk stacks the variants in one grid cell so the layout never jumps */
.scn>*{transition:opacity .22s cubic-bezier(.2,.8,.2,1)}
.sc-out>*{opacity:0!important;transition:opacity .2s!important}
.sc-cut,.sc-cut *,.sc-cut *::before,.sc-cut *::after{transition:none!important}
[data-on]{opacity:0;transition:opacity .22s cubic-bezier(.2,.8,.2,1)}
.scn[data-st="0"] [data-on~="0"],.scn[data-st="1"] [data-on~="1"],.scn[data-st="2"] [data-on~="2"],.scn[data-st="3"] [data-on~="3"],.scn[data-st="4"] [data-on~="4"],.scn[data-st="5"] [data-on~="5"]{opacity:1}
.stk{display:grid}.stk>*{grid-area:1/1;min-width:0}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.btn.press{transform:scale(.95)}
.scn span.btn{pointer-events:none;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips>*{font:500 12px/1.2 var(--mono);letter-spacing:.02em;border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.chips a{color:var(--ink)}
.chips a:hover{border-color:var(--ink)}
.chips.rise>*{opacity:0;transform:translateY(6px);transition:opacity .22s cubic-bezier(.2,.8,.2,1),transform .22s cubic-bezier(.2,.8,.2,1),border-color .2s;transition-delay:calc(var(--i,0)*90ms)}
.chips.rise.shown>*{opacity:1;transform:none}

/* bento */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cd{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:32px;display:flex;flex-direction:column;gap:26px;min-height:380px;min-width:0;transition:border-color .3s}
.cd::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(340px circle at var(--x,50%) var(--y,0%),color-mix(in srgb,var(--hi) 15%,transparent),transparent 70%);opacity:0;transition:opacity .35s}
.cd:hover{border-color:var(--line-2)}
.cd:hover::before{opacity:1}
.cd>*{position:relative}
.cd h3{font-size:1.6rem;line-height:1.1;letter-spacing:-.035em;font-weight:var(--w-h3)}
.vis{margin-top:auto}
@media (max-width:860px){.bento{grid-template-columns:minmax(0,1fr)}.cd{padding:24px;min-height:0}}

/* mini editor: a teammate joins, the test fails, they fix the off-by-one, the tests pass */
.ed{position:relative;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;font:13px/22px var(--mono);color:var(--ink-2);overflow:hidden}
.ed-top{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font:500 11px/1.3 var(--mono);letter-spacing:.04em;color:var(--ink-3)}
.ed .ok{color:var(--now)}
.avs{display:flex;flex:none}
.avs i{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:var(--surface)}
.avs .av-peer{margin-left:-6px;border-color:var(--now);transform:scale(0);transition:transform .56s cubic-bezier(.34,1.4,.64,1)}
.s1 .avs .av-peer{transform:none}
.ed-code{position:relative;padding:12px 16px}
.ed .l{display:block;white-space:pre;height:22px}
.ed .k{color:var(--hi)}
.ed .bug{margin:0 -16px;padding:0 16px;transition:background-color .22s}
.scn[data-st="2"] .bug{background:color-mix(in srgb,var(--wait) 14%,transparent)}
.scn[data-st="3"] .bug{background:color-mix(in srgb,var(--now) 12%,transparent)}
.del{display:inline-block;overflow:hidden;vertical-align:top;max-width:4ch;transition:max-width .56s cubic-bezier(.65,0,.35,1)}
.s3 .del{max-width:0}
.cur{position:absolute;left:calc(16px + var(--c,0)*1ch);top:calc(13px + var(--r,0)*22px);width:2px;height:20px;border-radius:1px;transition:left .9s cubic-bezier(.65,0,.35,1),top .9s cubic-bezier(.65,0,.35,1),opacity .22s}
.cur i{position:absolute;bottom:100%;left:0;margin-bottom:2px;padding:1px 7px;border-radius:5px 5px 5px 0;font:600 10px/1.6 var(--mono);font-style:normal;white-space:nowrap}
.cur.ca{--r:1;--c:13;background:var(--ink)}.cur.ca i{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cur.cb{--r:1;--c:13;opacity:0;background:var(--now)}.cur.cb i{background:var(--now);color:var(--now-ink)}
.s1 .cur.ca{--r:4;--c:26}
.s1 .cur.cb{opacity:1;transition-delay:.4s}
.s2 .cur.cb{--r:2;--c:30;transition-delay:0s}
.s2 .cur.cb i{left:auto;right:0;border-radius:5px 5px 0 5px}
.s3 .cur.cb{--c:26;transition-duration:.56s}
.ed-run{position:relative;display:flex;align-items:center;padding:9px 14px 10px;border-top:1px solid var(--line);font:500 12px/1.3 var(--mono);color:var(--ink-3)}
.ed-run b{font-weight:500}
.ed-run .no{color:var(--wait-text,var(--wait))}
.ed-run .ok{transition-delay:.6s}
.rb{position:absolute;left:0;top:-1px;height:2px;width:0;background:var(--ink-3)}
.s1 .rb{width:100%;transition:width 1.8s linear,background-color .22s}
.scn[data-st="2"] .rb{background:var(--wait)}
.scn[data-st="3"] .rb{background:var(--now);animation:rerun .6s linear}
@keyframes rerun{from{width:0}to{width:100%}}

/* study: one set of files becomes a study page read aloud, flashcards, a quiz, then you explain it back */
.fs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.outs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.outs span{font:500 11px/1 var(--mono);letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--ink-3);transition:color .22s,border-color .22s}
.outs span.on{color:var(--ink);border-color:var(--now)}
.stu{position:relative;height:184px}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;gap:7px;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.pane small{font:500 11px/1.3 var(--mono);letter-spacing:.04em;color:var(--ink-3)}
.pane b{font:500 15px/1.35 var(--display);letter-spacing:-.01em;color:var(--ink)}
.skl{display:grid;gap:7px;margin-top:2px}
.skl i{display:block;height:7px;border-radius:4px;background:var(--line)}
.skl i:last-child{width:62%}
.aud{display:flex;align-items:center;gap:14px;margin-top:auto}
.pb{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink);display:grid;place-items:center;flex:none}
.pb svg{width:16px;height:16px}
.bars{display:flex;align-items:center;gap:3px;height:34px;flex:1;min-width:0}
.bars i{display:block;flex:1;max-width:4px;height:100%;border-radius:2px;background:var(--hi);transform:scaleY(var(--h,.4));animation:eq 1.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes eq{0%,100%{transform:scaleY(var(--h,.4))}50%{transform:scaleY(calc(var(--h,.4)*.35 + .15))}}
.aud small{flex:none}
.p1{background:none;border:0;padding:0;perspective:900px}
.fc{position:relative;flex:1;transform-style:preserve-3d;transition:transform .56s cubic-bezier(.65,0,.35,1)}
.s2 .fc{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:16px 18px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.fc .fcb{transform:rotateY(180deg);border-color:var(--now)}
.fc b{font-size:16px}
.opt{display:flex;align-items:center;gap:8px;min-height:27px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:13.5px;color:var(--ink-2);transition:border-color .22s .9s,color .22s .9s,background-color .22s .9s}
.opt:empty::before{content:"";height:6px;width:55%;border-radius:3px;background:var(--line)}
.opt span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt svg{width:14px;height:14px;flex:none;color:var(--now);opacity:0;transition:opacity .22s .9s}
.s3 .opt.ok{border-color:var(--now);color:var(--ink);background:color-mix(in srgb,var(--now) 10%,transparent)}
.s3 .opt.ok svg{opacity:1}
.p3{align-items:center;justify-content:center;gap:12px}
.p3 .aud{margin:0;width:100%}
.p3 .pb{background:var(--now);border-color:var(--now);color:var(--now-ink)}

/* agents: the list, and a sheet that builds one more */
.ags{position:relative;display:grid;gap:8px;overflow:hidden;border-radius:16px}
.ar{display:flex;align-items:center;gap:12px;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;min-width:0}
.ar b{font-weight:600;font-family:var(--display);letter-spacing:-.01em;white-space:nowrap}
:root[data-base="b"] .ar b{font-weight:500}
.ar small{margin-left:auto;font:11px var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ar em{font:500 11px var(--mono);font-style:normal;border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;color:var(--ink-2);white-space:nowrap}
.sd{width:8px;height:8px;border-radius:50%;background:var(--now);flex:none;animation:ping 2.4s ease-out infinite}
.sd.wt{background:var(--wait);animation:knock 2.4s ease-in-out infinite}
.ar.wt small{color:var(--wait-text,var(--wait))}
.ar.n{border-style:dashed;color:var(--ink-3);justify-content:center;transition:border-color .22s,color .22s,opacity .22s}
.scn[data-st="0"] .ar.n{animation:nhl 1.4s forwards}
@keyframes nhl{0%,64%{border-color:var(--line);color:var(--ink-3)}100%{border-color:var(--ink-3);color:var(--ink-2)}}
.s5 .ar.n{border-style:solid;color:var(--ink)}
.ar.n .stk{width:100%}
.ar.n .nw0{justify-self:center}
.nw1{display:flex;align-items:center;gap:12px;min-width:0}
.ag-sheet{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;transform:translateY(105%);transition:transform .56s cubic-bezier(.65,0,.35,1),opacity .22s}
.s1 .ag-sheet{transform:none}
.s5 .ag-sheet{transform:translateY(105%)}
.ag-steps{display:flex;gap:6px;flex-wrap:wrap}
.ag-steps span{font:500 11px/1 var(--mono);letter-spacing:.04em;padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);transition:color .22s,border-color .22s}
.ag-steps span.on{color:var(--ink);border-color:var(--now)}
.ag-steps span.done{color:var(--ink-2)}
.ag-steps span.done::before{content:"\2713\00a0";color:var(--now)}
.agps{flex:1;display:grid;min-height:0}
.agp{grid-area:1/1;min-width:0;min-height:0}
.agt{height:100%;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;background:var(--bg-2);font-size:15px;line-height:1.45;color:var(--ink)}
.caret{display:inline-block;width:2px;height:1.05em;margin-left:1px;vertical-align:-.15em;background:var(--now);animation:blink 1s steps(1) infinite}
.agb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.agb>div{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;background:var(--bg-2)}
.agb i{display:block;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.agb i.nx{position:relative;border-color:var(--now)}
.agb i.nx::after{content:"";position:absolute;right:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--now)}
.agc{display:flex;flex-direction:column;justify-content:center;gap:8px}
.agc span{display:block;height:26px;border-radius:13px;border:1px solid var(--line)}
.agc .uq{align-self:flex-end;width:55%;background:var(--surface-2)}
.agc .ua{align-self:flex-start;width:75%;background:var(--bg-2);opacity:0;transition:opacity .22s}
.scn[data-st="3"] .agc .ua{opacity:1;transition-delay:.7s}
.agn{display:flex;flex-direction:column;justify-content:center;gap:12px}
.agnm{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;background:var(--bg-2);min-width:0}
.agnm b{font:500 15px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agnm em{margin-left:auto;font:500 11px var(--mono);font-style:normal;border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;color:var(--ink-2);white-space:nowrap}
.agcr{align-self:flex-end}

/* voice: hold to speak, the rough transcript, the clean sentence; then live talk, which you can cut into */
.vc{display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:16px}
.vmodes{display:flex;gap:6px;align-self:flex-start}
.vmodes span{font:500 11px/1 var(--mono);letter-spacing:.04em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);transition:color .22s,border-color .22s,background-color .22s}
.vmodes .vm0,.s3 .vmodes .vm1{color:var(--ink);border-color:var(--ink-3);background:var(--surface)}
.s3 .vmodes .vm0{color:var(--ink-3);border-color:var(--line);background:none}
.wv{display:flex;align-items:center;gap:4px;height:64px;transform:scaleY(.3);transition:transform .56s cubic-bezier(.65,0,.35,1),opacity .22s}
.scn[data-st="0"] .wv,.scn[data-st="3"] .wv{transform:none}
.wv i{display:block;width:4px;height:100%;border-radius:2px;background:var(--ink-3);transform:scaleY(var(--h,.4));animation:eq 1.4s ease-in-out infinite;animation-delay:var(--d,0s);transition:background-color .22s}
.s3 .wv i{background:var(--now)}
.s4 .wv i{background:var(--ink-3)}
.vtx{width:100%;min-height:4.4em;justify-items:center;align-items:center;text-align:center;font-size:15px;line-height:1.45;color:var(--ink)}
.vtx .raw{color:var(--ink-3)}
.vbot{display:flex;align-items:center;gap:12px;width:100%}
.vmic{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center;color:var(--ink)}
.vmic svg{width:16px;height:16px}
.vmic svg.vr{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.vmic circle{fill:none;stroke-width:2.2}
.vmic .bg{stroke:var(--line-2)}
.vmic .rg{stroke:var(--ink);stroke-linecap:round;stroke-dasharray:88;stroke-dashoffset:88}
.scn[data-st="0"] .vmic .rg{animation:holdfill .9s cubic-bezier(.65,0,.35,1) forwards}
.vmic::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--now);opacity:0}
.scn[data-st="4"] .vmic::after{animation:ripple 1.1s cubic-bezier(.2,.8,.2,1) 2}
@keyframes holdfill{from{stroke-dashoffset:88}to{stroke-dashoffset:0}}
.lgn{margin-left:auto;font:500 11px/1 var(--mono);letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--ink-2);transition:opacity .3s,transform .3s}
.lgn.out{opacity:0;transform:translateY(4px)}
.vc small{font:12px var(--mono);color:var(--ink-3);letter-spacing:.04em}

/* A2A */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tabs button{appearance:none;position:relative;overflow:hidden;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);border-radius:999px;min-height:42px;padding:0 18px;font:500 14px/1 var(--body);cursor:pointer;transition:color .2s,border-color .2s,background-color .2s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink-3);background:var(--surface)}
.tabs .pg{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--hi)}
.a2a{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:40px;align-items:start}
.a2a-txt{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.a2a-txt h3{font-size:1.75rem;line-height:1.15;letter-spacing:-.03em;font-weight:var(--w-h3)}
.a2a-txt p{color:var(--ink-2)}
/* relay: sealed at your end, queued at the relay while their machine is off, delivered when it comes on */
.relay{margin-top:4px;padding-top:18px;border-top:1px solid var(--line)}
.rl-track{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:12px}
.rl-track::before{content:"";position:absolute;left:12px;right:12px;top:11px;border-top:1px dashed var(--line-2)}
.rl-n{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:9em;font:500 11px/1.35 var(--mono);color:var(--ink-3);text-align:center}
.rl-n b{font-weight:500}
.rl-a{justify-self:start;align-items:flex-start;text-align:left}
.rl-h{justify-self:center}
.rl-b{justify-self:end;align-items:flex-end;text-align:right}
.rl-n i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-3);background:var(--surface);transition:border-color .22s}
.rl-a i{border-color:var(--ink)}

@keyframes tspin{to{transform:rotate(360deg)}}
@keyframes tpill{0%,26%,100%{stroke:currentColor}8%,18%{stroke:var(--hi)}}
@media (max-width:980px){.tiers{grid-template-columns:minmax(0,1fr)}}

/* faq */
.faq{max-width:840px;margin-inline:auto}
details{border-top:1px solid var(--line)}
details:last-child{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;font:600 1.2rem/1.35 var(--display);letter-spacing:-.02em}
:root[data-base="b"] summary{font-weight:500}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 26px/1 var(--mono);color:var(--ink-3);flex:none;transition:transform .25s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 40px 24px 0;color:var(--ink-2)}

/* finale (11/1, V7): the agents from the page at work in one window. A ring fills while its task runs and the cyan dot rides the arc;
   an amber dot outside the ring waits for you; a closed ring with a check is done. The counters add up the rows. */
.fw{position:relative;z-index:1;max-width:1040px;margin:0 auto;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--line-2);border-radius:var(--r-win);box-shadow:0 60px 120px -60px var(--shade)}
.fstat{display:flex;flex-wrap:wrap;gap:8px 22px;padding:12px 18px;border-bottom:1px solid var(--line);font:500 12px/1.3 var(--mono);color:var(--ink-3)}
.fstat>span{display:inline-flex;align-items:center;gap:8px}
.fstat i{width:8px;height:8px;border-radius:50%;flex:none}
.fstat .fs0 i{background:var(--dot);border:1.5px solid var(--dot-edge);animation:ping 2.4s ease-out infinite}
.fstat .fs1 i{background:var(--wait);border:1.5px solid var(--wait-edge)}
.fstat .fs2 i{width:10px;height:10px;border:1.8px solid var(--mark)}
.fstat b{display:inline-block;min-width:1ch;text-align:right;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.fstat b.bump{animation:bump .36s cubic-bezier(.34,1.4,.64,1)}
/* a count at zero goes quiet: no pulse, dimmed */
.fstat .zero i{animation:none;opacity:.4}
.fstat .zero b{color:var(--ink-3)}
@keyframes bump{40%{transform:translateY(-3px) scale(1.2)}}
.frows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:14px}
.fr{position:relative;display:flex;align-items:center;gap:12px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);transition:border-color .3s}
.scn[data-st="0"] .fr{animation:frin .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*70ms)}
@keyframes frin{from{opacity:0;transform:translateY(8px)}}
.fr.is-wait{border-color:color-mix(in srgb,var(--wait) 55%,var(--line))}
.fr.is-flash{animation:frok .8s ease-out}
@keyframes frok{0%{border-color:var(--now)}100%{border-color:var(--line)}}
.frg{width:30px;height:30px;flex:none;overflow:visible}
.frg circle,.frg path{fill:none}
.frg .rg-t{stroke:var(--line-2);stroke-width:2}
.frg .rg-a{stroke:var(--mark);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:100px 100px;stroke-dashoffset:calc((1 - var(--p,0))*100px);transform:rotate(-90deg);transform-origin:16px 16px;transition:stroke-dashoffset var(--bd,1.8s) linear}
.frg .rg-h{transform:rotate(calc(var(--p,0)*360deg));transform-origin:16px 16px;transition:transform var(--bd,1.8s) linear,opacity .22s}
.frg .rg-h circle{fill:var(--dot);stroke:var(--dot-edge);stroke-width:1.2}
.frg .rg-w{fill:var(--wait);stroke:var(--wait-edge);stroke-width:1.2;opacity:0;transform-origin:27px 5px;transition:opacity .22s}
.frg .rg-c{stroke:var(--now);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transform-origin:16px 16px;transition:opacity .22s,transform .36s cubic-bezier(.34,1.4,.64,1)}
.fr.is-wait .rg-h,.fr.is-done .rg-h{opacity:0}
.fr.is-wait .rg-w{opacity:1;animation:knock 2.4s ease-in-out infinite}
.fr.is-done .rg-a{transition-duration:.5s}
.fr.is-done .rg-c{opacity:1;transform:none}
.ft{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.ft1{display:flex;align-items:center;gap:8px;min-width:0}
.ft1 b{font:500 15px/1.25 var(--display);letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ft1 em{flex:none;font:500 10.5px/1 var(--mono);font-style:normal;border:1px solid var(--line-2);border-radius:999px;padding:3px 8px;color:var(--ink-3);white-space:nowrap}
.fx{font:12px/1.35 var(--mono);color:var(--ink-3)}
.fx>span{opacity:0;transition:opacity .22s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx>span.on{opacity:1}
.fx .fn{font:inherit;background:none;border:0;padding:0;color:var(--ink-2)}
.fr.is-wait .fx{color:var(--wait-text,var(--wait))}
.fr.is-done .fx{color:var(--ink-2)}
.fr.is-wait .ft{padding-right:104px}
.fa{position:absolute;right:12px;top:50%;margin-top:-16px;min-height:32px;padding:0 14px;font-size:13px;opacity:0;transition:opacity .22s,transform .15s,border-color .22s,color .22s}
.fr.is-wait .fa{opacity:1}
.fa svg{display:none;width:14px;height:14px}
.fa.ok{border-color:var(--now);color:var(--now)}
.fa.ok svg{display:block}
.fsum{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px 16px;font:500 12.5px/1.4 var(--mono);color:var(--ink-2);text-align:center}
.fsum svg{width:14px;height:14px;flex:none;color:var(--now)}
:root[data-end="off"] #finale{display:none}
@media (max-width:760px){.frows{grid-template-columns:minmax(0,1fr);gap:6px;padding:10px}.fr{padding:9px 10px}.fstat{gap:6px 14px;padding:10px 14px}.ft1 em{display:none}}

/* access */
.ac{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line-2);border-radius:36px;padding:96px 24px;text-align:center}
:root[data-base="b"] .ac{background:color-mix(in srgb,var(--surface) 55%,transparent);border-color:var(--line);border-radius:28px}
.ac .spot2{position:absolute;left:50%;top:50%;width:700px;height:700px;margin:-350px 0 0 -350px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 62%);pointer-events:none;will-change:transform}
.ac>*{position:relative}
.ac h2{font-size:clamp(2.4rem,6vw,4.6rem);line-height:1;letter-spacing:-.05em;max-width:13em;margin:0 auto}
:lang(zh) .ac h2{letter-spacing:0;line-height:1.15}
.ac .sub{margin:18px auto 0}
.form{display:flex;flex-direction:column;gap:12px;max-width:520px;margin:36px auto 0}
.form .row{display:flex;gap:10px;flex-wrap:wrap}
.form input{flex:1 1 220px;min-width:0;min-height:54px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);padding:0 24px;font:400 16px var(--body)}
.form input::placeholder{color:var(--ink-3)}
.form .btn{min-height:54px}
.form .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.form .msg{min-height:22px;font-size:14px;color:var(--ink-2)}
.wrapb{padding-block:0 80px}
:root[data-base="b"] .wrapb{padding-bottom:0}
footer{border-top:1px solid var(--line);padding-block:32px 96px}
footer .w{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px 28px;font-size:14px;color:var(--ink-3)}
footer nav{display:flex;gap:20px}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}
footer em{font-style:normal;color:var(--ink-2)}
@media (max-width:860px){.ac{padding:60px 20px;border-radius:28px}}

/* particle field (base B only) */
#pf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;display:none}
:root[data-base="b"] #pf{display:block}

/* preview switches: only on this preview, not part of the site */
.pvbar{position:fixed;left:16px;right:16px;margin-inline:auto;width:fit-content;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px);padding:6px 8px;border:1px dashed var(--line-2);border-radius:14px;background:var(--head);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font:500 12px/1 var(--mono);color:var(--ink-3);box-shadow:0 20px 40px -20px var(--shade)}
.pvbar>span{padding-left:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-3);font:500 12px/1 var(--mono);padding:7px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
@media (max-width:560px){.pvbar{gap:6px;padding:5px 6px}.pvbar>span{display:none}.seg button{padding:7px 6px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.mq{width:auto;flex-wrap:wrap}}
</style>
</head>
<body>
<canvas id="pf" aria-hidden="true"></canvas>

<header class="top">
  <div class="w">
    <a class="brand" href="#top" aria-label="OpenMousse">
      <svg class="lg-a" viewBox="0 0 26 26" aria-hidden="true"><rect x="7" y="2" width="12" height="6" rx="3" fill="var(--accent)"/><rect x="4" y="10" width="18" height="6" rx="3" fill="var(--ink)"/><rect x="1" y="18" width="24" height="6" rx="3" fill="var(--ink)"/></svg>
      <svg class="lg-b" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="8" fill="none" stroke="#D9AE62" stroke-width="2.4"/><circle class="dt" cx="18.657" cy="7.343" r="2.08"/></svg>

<main id="top">
  <section class="hero" id="hero" data-scene="ring">
    <div class="grid" aria-hidden="true"></div>

    <div class="w">

      <p class="rot" aria-live="off"><span data-k="hero.rot_prefix"></span> <span id="rot"></span></p>
      <div class="cta">
        <a class="btn btn-pri mag" href="#access" data-k="hero.cta1"></a>
        <a class="btn btn-ghost mag" href="#a2a" data-k="hero.cta2"></a>
      </div>

      <div class="stage" id="stage">
        <div class="fl f1 bob" data-d="34"><span class="av"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l-3 3 3 3M11 5l3 3-3 3M9.2 3.5l-2.4 9"/></svg></span><div><span data-k="hero.cards.0.title"></span><small data-k="hero.cards.0.sub"></small></div></div>
        <div class="fl f2 bob" data-d="52"><span class="rr" aria-hidden="true"><i></i><i></i><i></i></span><div><span data-k="hero.cards.1.title"></span><small data-k="hero.cards.1.sub"></small></div></div>
        <div class="fl f3 bob" data-d="46"><span class="av v"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 6.5v3M6 4.5v7M9 3v10M12 5.5v5"/></svg></span><div><span data-k="hero.cards.2.title"></span><small data-k="hero.cards.2.sub"></small></div></div>
        <div class="fl f4 bob" data-d="30"><span class="av q" aria-hidden="true"></span><div><span data-k="hero.cards.3.title"></span><small data-k="hero.cards.3.sub"></small></div></div>

        <div class="win" id="win">
          <div class="wtop"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><b data-k="hero.win_title"></b><span class="live" data-k="hero.win_badge"></span></div>

              <input type="file" id="file" multiple hidden accept=".pdf,.doc,.docx,.txt,.md,.csv,.xlsx,.pptx,.png,.jpg,.jpeg,.py,.ipynb,.tex">
              <div class="mdl">
                <button class="mb" id="mbtn" type="button" aria-haspopup="menu" aria-expanded="false"><span id="mname">Claude</span><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg></button>

  <div class="strip"><div class="mq" id="mq" aria-hidden="true"></div></div>

  <section class="sec" id="a2a" data-scene="two">

        <p class="sr" data-k="a2a.sub"></p>

          <p class="sr" id="a2aP"></p>
          <p class="sr"><span data-k="a2a.relay.sealed"></span>. <span data-k="a2a.relay.queued"></span></p>
          <div class="relay" id="scRelay" aria-hidden="true">

              <span class="rl-n rl-a"><i></i><b data-k="a2a.you"></b></span>

              <span class="env"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5"/><path d="M2 4.5l6 4.5 6-4.5"/></svg></span>
            </div>
            <p class="rl-cap stk"><span data-on="0" data-k="a2a.relay.sealed"></span><span data-on="1 2 3" data-k="a2a.relay.wait"></span><span class="ok" data-on="4" data-k="a2a.relay.done"></span></p>

            <span class="node r" id="nodeRw"><span class="nn"><b id="nodeR"></b><small id="nodeRs" hidden></small></span><span class="nd" id="ndR"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="6" r="2.6"/><path d="M3 14c.8-2.6 2.7-3.8 5-3.8s4.2 1.2 5 3.8"/></svg></span></span>

  <section class="sec" id="platform" data-scene="scatter" style="padding-top:20px">
    <div class="w">
      <div class="head c">
        <p class="kick" data-k="platform.kick"></p>
        <h2 data-k="platform.h2"></h2>
      </div>
      <div class="bento">
        <article class="cd">
          <div><h3 data-k="platform.cards.0.h"></h3><p class="sr" data-k="platform.cards.0.p"></p></div>
          <div class="vis">
            <div class="ed" id="scCode" aria-hidden="true">
              <div class="ed-top"><span class="avs"><i class="av-you"></i><i class="av-peer"></i></span><span class="stk"><span data-on="0 2 3" data-k="hero.cards.0.sub"></span><span class="ok" data-on="1" data-k="platform.code.joined"></span></span></div>
              <div class="ed-code">
                <span class="l"><span class="k">def</span> mean(xs):</span>
                <span class="l">    total = 0</span>
                <span class="l bug">    <span class="k">for</span> i <span class="k">in</span> range(len(xs)<span class="del"> - 1</span>):</span>
                <span class="l">        total += xs[i]</span>
                <span class="l">    <span class="k">return</span> total / len(xs)</span>
                <span class="cur ca"><i data-k="platform.code_you"></i></span><span class="cur cb"><i data-k="platform.code_peer"></i></span>
              </div>
              <div class="ed-run"><span class="rb"></span><span class="stk"><span data-on="0 1">$ pytest</span><span class="no" data-on="2">&#10007; <b data-k="platform.code.fail"></b></span><span class="ok" data-on="3">&#10003; <b data-k="platform.code.pass"></b></span></span></div>
            </div>
          </div>
        </article>
        <article class="cd">
          <div><h3 data-k="platform.cards.1.h"></h3><p class="sr" data-k="platform.cards.1.p"></p></div>
          <div class="vis" aria-hidden="true">
            <div class="fs"><span class="fchip"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 1.5h5.5L13 5v9.5H4z"/></svg><span>lecture-4.pdf</span></span><span class="fchip"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 1.5h5.5L13 5v9.5H4z"/></svg><span>chapter-7.pdf</span></span><span class="fchip"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 1.5h5.5L13 5v9.5H4z"/></svg><span>notes.md</span></span></div>
            <div class="outs" id="outs"></div>
            <div class="stu" id="scStudy">
              <div class="pane p0" data-on="0"><b data-k="platform.study.page"></b><span class="skl"><i></i><i></i><i></i></span><div class="aud"><span class="pb"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span><div class="bars" id="bars"></div><small data-k="platform.study.read"></small></div></div>

penMousse 必须要付订阅费吗？"},"a":{"en":"No. Running OpenMousse on your own laptop or server with your own API keys is free, with no base subscription. You only pay if you add optional One-click cloud hosting, Built-in models, or paid agents from the Agent store.","zh":"不用。在自己的笔记本或服务器上运行、接入自己的 API key 完全免费，没有基础订阅费。只有当你按需开通一键云、内置模型，或在商店订阅付费 agent 时才需付费。"}},{"q":{"en":"Can I use my own API keys or local models?","zh":"我可以用自己的 API key 或本机模型吗？"},"a":{"en":"Yes. Bring your own keys for Claude, OpenAI, Gemini, DeepSeek, Qwen, Kimi, GLM, local models, or any OpenAI-compatible endpoint. Or use the optional Built-in models catalog and assign different models to each agent.","zh":"可以。你可以自带 Claude、OpenAI、Gemini、DeepSeek、Qwen、Kimi、GLM 的 key，或接入本机模型与任何 OpenAI 兼容接口；也可以开通可选的内置模型，为每个 Agent 分别指定模型。"}},{"q":{"en":"How do agent-assisted conversations work, and can a friend's agent trigger my tools?","zh":"Agent 协助沟通是怎么运作的？好友的 agent 能动用我的工具吗？"},"a":{"en":"No, incoming agent messages cannot trigger your tools. In agent-assisted conversations (A2A), agents help check schedules, summarize ideas, or answer follow-ups, while people make the final decisions. External messages are processed strictly as data by a tool-disabled model, and strangers are ignored by default.","zh":"不能，外来消息无法动用你的工具。在 Agent 协助沟通（A2A）中，Agent 帮你们核对日程、总结想法或回答追问，最终由本人拍板。别人的 agent 发来的话只当资料，由禁用工具的模型处理；陌生人默认一律不理。"}},{"q":{"en":"Where is my data stored, and what gets sent to models?","zh":"我的数据存在哪里？对话时会发给模型什么？"},"a":{"en":"On the machine running OpenMousse: your laptop, your server, or your allocated One-click cloud server. During each turn, OpenMousse sends your message and only the memories needed for that turn to the model you selected.","zh":"存在运行 OpenMousse 的那台机器上：你的笔记本、你的服务器，或为你分配的一键云服务器。每轮对话时，系统只把当轮消息和回答所需的记忆发给你所选的模型。"}},{"q":{"en":"Is OpenMousse open source?","zh":"OpenMousse 是开源的吗？"},"a":{"en":"Yes, open-source core under AGPL-3.0 at github.com/openmousse. Code for data storage, deletion, export, model selection, encrypted friend relays, and approvals is open source and inspectable, while some modules are hosted-only.","zh":"是核心开源。基础部分以 AGPL-3.0 开源在 github.com/openmousse，部分模块仅在托管版提供。负责数据存储、删除、导出、选模型、好友加密中继与审批的代码均开源可查。"}},{"q":{"en":"Do I need an account if I run it on my own machine?","zh":"在自己的机器上运行也要注册账户吗？"},"a":{"en":"Yes. Every installation requires an account registration. The account is used only to count installations.","zh":"需要。所有安装都要注册账户，该账户仅用于统计安装数量。"}}]},"access":{"h2":[{"en":"You shape intelligence; *intelligence becomes you.*","zh":"你塑智能，*智能成你。*"},{"en":"Shape intelligence. *Make it yours.*","zh":"塑造智能，*为你所用。*"}],"sub":{"en":"Apply for early access and get in first.","zh":"申请抢先体验，第一时间上手。"},"placeholder":{"en":"Your email address","zh":"输入你的邮箱地址"},"btn":{"en":"Get early access","zh":"申请抢先体验"},"ok":{"en":"Thanks. You are on the early access list.","zh":"已收到，你已加入抢先体验名单。"},"err":{"en":"Enter a valid email address.","zh":"请输入有效的邮箱地址。"}},"footer":{"tagline":{"en":"Your AI. Your memory. *Your machine.*","zh":"你的模型。你的记忆。*你的机器。*"},"links":{"github":{"en":"GitHub","zh":"GitHub"},"docs":{"en":"Docs","zh":"文档"},"privacy":{"en":"Privacy","zh":"隐私政策"}}},"finale":{"kick":{"en":"IN PARALLEL","zh":"同时开工"},"h2":{"en":"Working in parallel. *Waiting on your call.*","zh":"多线同时推进，*关键处等你拍板。*"},"win":{"en":"Active workspace","zh":"当前工作台"},"stats":[{"en":"running","zh":"进行中"},{"en":"awaiting approval","zh":"等你批准"},{"en":"completed","zh":"已完成"}],"rows":[{"name":{"en":"Pair programming","zh":"结对编程"},"run":[{"en":"Editing `worker_pool.rs` together","zh":"与朋友同改 `worker_pool.rs`"},{"en":"Running 14 unit tests","zh":"正在运行 14 项测试"}],"done":{"en":"All 14 tests passing","zh":"14 项测试全部通过"}},{"name":{"en":"Study coach","zh":"复习助手"},"run":[{"en":"Reading `lecture-4.pdf`","zh":"正在读取 `lecture-4.pdf`"},{"en":"Building flashcards","zh":"正在生成闪卡"}],"done":{"en":"12 flashcards · quiz ready","zh":"12 张闪卡 · 自测已就绪"}},{"name":{"en":"Paper tracker","zh":"论文追踪"},"run":[{"en":"Indexing today's preprints","zh":"正在索引今日预印本"},{"en":"Extracting method tables","zh":"正在提取实验对比表"}],"done":{"en":"6 reading cards ready","zh":"已生成 6 张阅读卡片"}},{"name":{"en":"Lab Report Grader","zh":"实验报告自查"},"run":[{"en":"Checking error propagation","zh":"正在核对误差传递"},{"en":"Verifying unit consistency","zh":"正在核对单位一致性"}],"done":{"en":"2 figure captions to revise","zh":"2 处图表题注待修改"}},{"name":{"en":"PR Review Bot","zh":"代码变更审查"},"run":[{"en":"Checking diff in sandbox","zh":"正在沙箱中检查代码改动"}],"done":{"en":"1 breaking API change flagged","zh":"标出 1 处破坏性接口变更"}},{"name":{"en":"Friend","zh":"朋友"},"run":[{"en":"Asked \"Are you free tonight?\"","zh":"发来「今晚有空吗？」"},{"en":"Checking your calendar","zh":"正在查你的日历"}],"wait":{"en":"Draft: \"19:00 works for me.\"","zh":"拟好回复「19:00 可以。」"},"done":{"en":"Reply sent","zh":"已发送"}},{"name":{"en":"Babel","zh":"Babel"},"run":[{"en":"Spoken in Spanish","zh":"用中文说出想法"},{"en":"Refining into English","zh":"正在整理成英文"}],"done":{"en":"Refined · ready for you to send","zh":"已整理好，等你按发送"}},{"name":{"en":"Memory","zh":"记忆"},"run":[{"en":"Sorting today's conversations","zh":"正在整理今日对话记忆"}],"done":{"en":"2 saved with source · 1 pending","zh":"已记下 2 条 · 1 条待确认"}}],"sum":{"en":"8 tasks completed · 1 reply approved by you","zh":"8 项任务已完成 · 1 条对外回复经你批准"},"sr":{"en":"Animation of an OpenMousse workspace running eight tasks in parallel across coding, study, research, and messaging. Seven complete automatically; one outgoing reply to a friend pauses until you approve it.","zh":"动画展示 OpenMousse 工作台同时推进结对编程、复习、论文追踪与消息回复等 8 项任务；其中对外发送给朋友的回复先停下等你批准。"}}}</script>
<script>
(function(){
  'use strict';
  var C={};try{C=JSON.parse(document.getElementById('copy').textContent)}catch(e){C={}}
  var root=document.documentElement;
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
  /* slogan 1 = the template's line, which Leo picked for the end on 10/31 */
  var S={lang:'en',base:'b',slogan:1,theme:'auto',end:'on'};

  /* ---------- copy ---------- */
  function get(path){return path.split('.').reduce(function(o,k){return o==null?undefined:o[k]},C)}
  function tx(v){if(v==null)return '';if(typeof v==='string')return v;var s=v[S.lang];return s==null||s===''?(v.en||''):s}
  function T(path){return tx(get(path))}
  function arr(path){var v=get(path);return Array.isArray(v)?v:[]}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function rich(s){return esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<span class="fn">$1</span>')}
  function plain(s){return String(s).replace(/\*([^*]+)\*/g,'$1').replace(/`([^`]+)`/g,'$1')}
  var ICON={
    person:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="6" r="2.6"/><path d="M3 14c.8-2.6 2.7-3.8 5-3.8s4.2 1.2 5 3.8"/></svg>',
    store:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h11l-1 7h-9z"/><path d="M5.5 6.5V5a2.5 2.5 0 0 1 5 0v1.5"/></svg>',
    mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
    check:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>',
    lock:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7"/></svg>'
  };

  /* ---------- scenes ----------
     beat(el,[ms per beat],{on,rb,fade}) loops the beats while el is on screen, then starts over (fading out first unless fade:false).
     el gets data-st (the beat now) and s1…sN (beats reached); on(i,s,re) runs at each beat, and again with re=true after fill() re-renders text.
     Reduced motion parks the scene on beat rb, the one that tells the most. */
  var SCN=[];
  var scObs='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){
    var s=e.target._scn;if(!s||s.stop)return;var was=s.vis;s.vis=e.isIntersecting;
    clearTimeout(s.t);clearTimeout(s.t2);
    if(!s.vis){s.el.classList.remove('sc-out');return}
    if(!was)breset(s);btick(s);
  })},{threshold:.4}):null;
  function beat(el,beats,o){if(!el)return null;o=o||{};
    var s={el:el,b:beats,i:-1,g:0,t:0,t2:0,vis:false,stop:false,fade:o.fade!==false,on:o.on||function(){},rb:o.rb==null?beats.length-1:o.rb};
    s.go=function(i){bgo(s,i)};s.halt=function(){bhalt(s)};
    el._scn=s;el.classList.add('scn');SCN.push(s);
    if(reduce||!scObs){s.stop=true;bgo(s,s.rb);return s}
    bgo(s,0);scObs.observe(el);return s;
  }
  function bgo(s,i){s.i=i;s.g++;s.el.dataset.st=i;for(var k=1;k<s.b.length;k++)s.el.classList.toggle('s'+k,i>=k);s.on(i,s,false)}
  function breset(s){s.el.classList.add('sc-cut');s.el.removeAttribute('data-st');void s.el.offsetWidth;bgo(s,0);void s.el.offsetWidth;s.el.classList.remove('sc-cut','sc-out')}
  function btick(s){
    clearTimeout(s.t);if(s.stop||!s.vis)return;
    s.t=setTimeout(function(){
      if(s.stop||!s.vis)return;
      if(s.i<s.b.length-1){bgo(s,s.i+1);btick(s);return}
      if(!s.fade){bgo(s,0);btick(s);return}
      s.el.classList.add('sc-out');
      s.t2=setTimeout(function(){breset(s);btick(s)},240);
    },s.b[s.i]);
  }
  function bhalt(s){s.stop=true;clearTimeout(s.t);clearTimeout(s.t2);s.el.classList.remove('sc-out','sc-cut')}
  function blater(s,ms,fn){var g=s.g;setTimeout(function(){if(s.g===g)fn()},ms)}

  function fill(){
    $$('[data-k]').forEach(function(el){
      var v=T(el.dataset.k);
      if(el.dataset.attr)el.dataset.attr.split(' ').forEach(function(a){el.setAttribute(a,plain(v))});
      else el.innerHTML=rich(v);
    });
    renderRot();renderMarquee();renderModels();renderAgents();renderOuts();renderLangs();renderTabs();renderFlow();renderMemText();renderMemBeats();renderStore();renderTiers();renderPrivacy();renderAllChips();renderFaq();renderFinale();renderSlogan();
    $$('h1,h2,h3').forEach(zhWrap);
    mem.dirty=true;
    SCN.forEach(function(s){s.g++;s.on(s.i,s,true)});
  }
  /* Chinese headings: keep-all stops every break, so put the break points back. First every clause stays whole and the
     heading breaks only after punctuation: the segmenter splits words like 工作台 into 工作 / 台, and text-wrap:balance
     would take that split or a space (上架 / Agent). Only a clause wider than the line also wraps between words
     (lim = line width in em; 0 = clauses stay whole) */
  var ZHSEG=window.Intl&&Intl.Segmenter?new Intl.Segmenter('zh',{granularity:'word'}):null;
  function zhEm(t){var w=0;for(var ch of t)w+=/[\u2e80-\u9fff\uff00-\uffef]/.test(ch)?1:/\s/.test(ch)?.28:.56;return w}
  function zhBreaks(el,lim){
    var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(function(n,ni){
      var cls=[],cur=[];for(var s of ZHSEG.segment(n.data)){cur.push(s.segment);if(/^[，。、；：！？]/.test(s.segment)){cls.push(cur);cur=[]}}
      if(cur.length)cls.push(cur);
      var f=document.createDocumentFragment(),add=function(t){f.appendChild(document.createTextNode(t))},br=function(){f.appendChild(document.createElement('wbr'))};
      cls.forEach(function(c,ci){
        if(ci)br();
        if(!lim||zhEm(c.join(''))<=lim*.95){add(c.join('').replace(/ /g,'\u00a0'));return}
        /* a long clause wraps between words: punctuation and single characters stick to the word before (the segmenter
           splits 工作台 into 工作 / 台), a single first character to the word after */
        var ch=[];c.forEach(function(p){var l=ch[ch.length-1];if(l&&!/\s$/.test(l)&&/^([，。、；：！？）」』》]|[\u3400-\u9fff])$/.test(p))ch[ch.length-1]+=p;else ch.push(p)});
        if(ch.length>1&&/^[\u3400-\u9fff]$/.test(ch[0])&&!/^\s/.test(ch[1]))ch.splice(0,2,ch[0]+ch[1]);
        ch.forEach(function(p,i){if(i&&!/^\s/.test(p))br();add(p)});
      });
      /* a clause that ends this text node (e.g. right before an <em>) can break there too */
      if(ni<nodes.length-1&&!cur.length)f.appendChild(document.createElement('wbr'));
      n.parentNode.replaceChild(f,n);
    });
  }
  function zhWrap(el){
    if(!ZHSEG||S.lang!=='zh')return;
    if(el._zhOut!==el.innerHTML)el._zhSrc=el.innerHTML;else el.innerHTML=el._zhSrc;
